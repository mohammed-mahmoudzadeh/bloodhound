[project]
name = "bloodhound"
version = "1.0.0"
description = "Share files over your local network — Android & desktop"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "flet-permission-handler==1.0.4",
    "ifaddr>=0.2.0",
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "qrcode>=7.4.2",
    "argcomplete>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
desktop = [
    "pymediainfo>=6.0.0",
]
android = [
    "flet-android-background>=0.0.1",
]

[project.scripts]
bloodhound = "bloodhound.core.share.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bloodhound.core.share" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.data-files]
"/etc/bash_completion.d" = ["completion/bloodhound"]

[tool.flet]
org = "org.bloodhound"
product = "BloodHound"
company = "BloodHound"
copyright = "Copyright (C) 2026 BloodHound"

[tool.flet.app]
path = "src"
module = "main"

# ---- Icons & Splash ----
[tool.flet.icons]
android = "assets/icon.png"
splash_android = "assets/splash_android.png"
splash_android_dark = "assets/splash_android_dark.png"

[tool.flet.splash]
color = "#FFFFFF"        # Light theme splash background
dark_color = "#000000"   # Dark theme splash background
android_gravity = "fill"
hide_animation = true

# ---- Android ----
[tool.flet.android]
dependencies = ["pyjnius", "flet-android-background"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.ACCESS_WIFI_STATE" = true
"android.permission.READ_MEDIA_IMAGES" = true
"android.permission.READ_MEDIA_VIDEO" = true
"android.permission.READ_MEDIA_AUDIO" = true
"android.permission.MANAGE_EXTERNAL_STORAGE" = true
"android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_DATA_SYNC" = true
"android.permission.POST_NOTIFICATIONS" = true

[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"

[tool.pyright]
exclude = [
    "**/build",
    "**/build-back",
    "**/.venv",
    "**/__pycache__",
    "**/dist",
    "**/node_modules",
]